# ==============================================================================
# CONFIG-EXAMPLES.yaml — справочник по всем режимам internal/tunnelconfig
# ==============================================================================
# Это НЕ готовый к использованию конфиг. Это шпаргалка: один синтаксически
# валидный минимальный пример сверху (можно прямо так запустить), а ниже —
# закомментированные блоки под каждый режим и его альтернативы.
#
# Взаимоисключающие вещи (нельзя одновременно в одном туннеле/конфиге)
# явно помечены "ВАРИАНТ A / ВАРИАНТ B" — раскомментируй только один.
#
# Использование: скопируй нужные блоки в свой ~/oobe/tunnels.yaml (или куда
# указал --config), убери "# " в начале нужных строк, удали то, что не нужно.
# ==============================================================================


# ------------------------------------------------------------------------------
# БЛОК 0 — ЧТО РЕАЛЬНО АКТИВНО В ЭТОМ ФАЙЛЕ (минимальный рабочий пример)
# ------------------------------------------------------------------------------
# Один server-туннель: форвард на локальный SSH. Без relay (значит только
# прямые P2P-соединения + публичная DHT), без upstream_socks, identity не
# указан (значит <oobe>/identity.key по умолчанию).

tunnels:
  - name: ssh
    type: forward
    mode: server
    protocol: tcp
    logical_port: 2200
    target: 127.0.0.1:22
    allow_unauthenticated: true   # см. БЛОК 5 — в проде так делать не стоит


# ==============================================================================
# БЛОК 1 — IDENTITY (где лежит приватный ключ узла)
# ==============================================================================
# ВАРИАНТ A (по умолчанию, ничего не пишем) — используется <oobe>/identity.key,
# создаётся автоматически при первом запуске рядом с бинарником. Для
# большинства случаев — это и есть правильный выбор, ничего указывать не надо.
#
# identity: (не указан)
#
# ВАРИАНТ B — явный путь. Абсолютный путь используется как есть; "~/..."
# раскрывается в домашнюю директорию; любой другой относительный путь
# резолвится от <oobe>, а не от текущей рабочей директории процесса.
#
# identity: tokens/../my-custom-identity.key   # -> <oobe>/my-custom-identity.key
# identity: /var/lib/p2p-netcat/identity.key   # абсолютный путь как есть


# ==============================================================================
# БЛОК 2 — RELAY-СТРАТЕГИЯ (три взаимоисключающих подхода)
# ==============================================================================
# ВАРИАНТ A — только свои relay-серверы, без публичного fallback.
# Максимальный контроль, но если все твои relay недоступны — P2P работает
# только там, где проходит прямое соединение (NAT позволяет).
#
# relays:
#   - addr: /ip4/203.0.113.10/tcp/4001/p2p/12D3KooWRelayOne
#     priority: 1
#   - addr: /ip4/203.0.113.20/tcp/4001/p2p/12D3KooWRelayTwo
#     priority: 2
# fallback_to_public_dht: false
#
# ВАРИАНТ B — свои relay в приоритете + публичная DHT как запасной канал
# (рекомендуется по умолчанию — это подразумевается, если fallback_to_public_dht
# не указан явно, он true по умолчанию). Хорошо против блокировки одного
# конкретного твоего VPS в отдельно взятой стране.
#
# relays:
#   - addr: /ip4/203.0.113.10/tcp/4001/p2p/12D3KooWRelayOne
#     priority: 1
# fallback_to_public_dht: true
#
# ВАРИАНТ C — вообще без своих relay, полагаемся только на публичную
# IPFS/libp2p DHT (opportunistic discovery). Проще всего в настройке, но
# best-effort, без гарантий доступности конкретного relay в моменте.
#
# relays: []
# fallback_to_public_dht: true


# ==============================================================================
# БЛОК 3 — UPSTREAM_SOCKS (весь исходящий трафик УЗЛА через прокси/Tor)
# ==============================================================================
# ВНИМАНИЕ: это НЕ то же самое, что SOCKS5 exit-node (БЛОК 7) — там прокси
# для ЧУЖОГО трафика, который идёт через тебя. Здесь — прокси для трафика
# САМОГО УЗЛА (к relay, к пирам).
#
# ВАРИАНТ A (по умолчанию) — прямые соединения, без прокси.
#
# upstream_socks: (не указан)
#
# ВАРИАНТ B — через Tor/любой SOCKS5. ВАЖНО: автоматически отключает
# QUIC/WebRTC/обычный WebSocket-транспорт (они не проксируются через SOCKS5
# в этой версии) — остаётся только TCP. Это защита от утечки, не баг.
#
# upstream_socks: 127.0.0.1:9050


# ==============================================================================
# БЛОК 4 — TCP forward (server + client — это ДВЕ СТОРОНЫ ОДНОГО туннеля,
# не альтернативы; server поднимается на машине с сервисом, client — на
# машине, откуда к сервису хотят достучаться)
# ==============================================================================
# tunnels:
#   - name: postgres-server        # <- на машине С Postgres
#     type: forward
#     mode: server
#     protocol: tcp
#     logical_port: 15432          # p2p-адрес туннеля (НЕ сетевой порт!)
#     target: 127.0.0.1:5432       # куда форвардить на этой машине
#     token_file: tokens/postgres.token
#
#   - name: postgres-client        # <- на машине, ОТКУДА подключаются
#     type: forward
#     mode: client
#     protocol: tcp
#     logical_port: 15432          # тот же logical_port, что у server
#     peer: 12D3KooWExamplePeerID  # PeerId машины с postgres-server
#     listen: 127.0.0.1:15432      # локальный bind:port для приложений
#     token_file: tokens/postgres.token


# ==============================================================================
# БЛОК 5 — UDP forward (тот же принцип, что БЛОК 4, но protocol: udp)
# ==============================================================================
# Пример: проброс WireGuard-подобного UDP-сервиса.
#
# tunnels:
#   - name: wg-server
#     type: forward
#     mode: server
#     protocol: udp
#     logical_port: 51820
#     target: 127.0.0.1:51820
#     token_file: tokens/wg.token
#
#   - name: wg-client
#     type: forward
#     mode: client
#     protocol: udp
#     logical_port: 51820
#     peer: 12D3KooWExamplePeerID
#     listen: 127.0.0.1:51820
#     token_file: tokens/wg.token


# ==============================================================================
# БЛОК 6 — АУТЕНТИФИКАЦИЯ ТУННЕЛЯ (взаимоисключающие варианты НА ТУННЕЛЬ)
# ==============================================================================
# Для server-туннелей типа socks/pty/exec обязательно ОДНО из двух:
#
# ВАРИАНТ A — pairing-токен (рекомендуется для приватных сервисов).
#
# tunnels:
#   - name: admin-shell
#     type: pty
#     mode: server
#     logical_port: 2222
#     token_file: tokens/shell.token
#
# ВАРИАНТ B — явно разрешить без токена (публичный/тестовый доступ,
# осторожно с этим на privileged-типах типа exec/pty!).
#
# tunnels:
#   - name: public-echo
#     type: forward          # type: forward можно без токена и без явного
#     mode: server            # allow_unauthenticated (по умолчанию считается
#     protocol: tcp            # обычным незащищённым форвардом, как в CLI);
#     logical_port: 7777        # для socks/pty/exec allow_unauthenticated
#     target: 127.0.0.1:7        # нужно указывать ЯВНО, см. ниже
#     allow_unauthenticated: true


# ==============================================================================
# БЛОК 7 — SOCKS5 exit-node (server-only; клиентская сторона — это ПРОСТО
# forward/client на тот же logical_port, клиент не должен ничего знать про
# SOCKS — вся SOCKS-логика на стороне сервера)
# ==============================================================================
# tunnels:
#   - name: exit-proxy              # на машине, которая станет "выходом"
#     type: socks
#     mode: server
#     logical_port: 10800
#     token_file: tokens/socks.token
#
#   - name: exit-proxy-client        # на машине, которая ХОЧЕТ выходить через neё
#     type: forward
#     mode: client
#     protocol: tcp
#     logical_port: 10800
#     peer: 12D3KooWExitNodePeerID
#     listen: 127.0.0.1:1080         # curl --socks5 127.0.0.1:1080 ...
#     token_file: tokens/socks.token


# ==============================================================================
# БЛОК 8 — Exec (server-only; выполняет фиксированную команду на каждое
# входящее соединение — как netcat -e, только через p2p)
# ==============================================================================
# tunnels:
#   - name: run-backup-script
#     type: exec
#     mode: server
#     logical_port: 9001
#     exec: /usr/local/bin/backup.sh
#     token_file: tokens/backup.token


# ==============================================================================
# БЛОК 9 — ПОЛНЫЙ РЕАЛИСТИЧНЫЙ ПРИМЕР (несколько режимов в одном демоне —
# то, ради чего существует мультитуннель; см. EXAMPLES.txt, Пример 4)
# ==============================================================================
# relays:
#   - addr: /ip4/203.0.113.10/tcp/4001/p2p/12D3KooWRelayOne
#     priority: 1
# fallback_to_public_dht: true
# upstream_socks: 127.0.0.1:9050
#
# tunnels:
#   - name: postgres
#     type: forward
#     mode: server
#     protocol: tcp
#     logical_port: 15432
#     target: 127.0.0.1:5432
#     token_file: tokens/postgres.token
#
#   - name: exit-proxy
#     type: socks
#     mode: server
#     logical_port: 10800
#     token_file: tokens/socks.token
#
#   - name: admin-shell
#     type: pty
#     mode: server
#     logical_port: 2222
#     token_file: tokens/shell.token
# ==============================================================================
